<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <title>醍醐骑自行车</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/><stop offset="1" stop-color="#e8f7ff"/>
    </linearGradient>
    <radialGradient id="body" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fffaf0"/><stop offset="0.7" stop-color="#fbe7c0"/><stop offset="1" stop-color="#f1cf92"/>
    </radialGradient>
    <clipPath id="frame"><rect width="600" height="400" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
  <rect width="600" height="400" fill="url(#sky)"/>

  <!-- 太阳 -->
  <g transform="translate(510,70)">
    <circle r="30" fill="#ffd95a"/>
    <g stroke="#ffd95a" stroke-width="4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      <line x1="0" y1="-40" x2="0" y2="-50" transform="rotate(0)"/><line x1="0" y1="-40" x2="0" y2="-50" transform="rotate(45)"/><line x1="0" y1="-40" x2="0" y2="-50" transform="rotate(90)"/><line x1="0" y1="-40" x2="0" y2="-50" transform="rotate(135)"/><line x1="0" y1="-40" x2="0" y2="-50" transform="rotate(180)"/><line x1="0" y1="-40" x2="0" y2="-50" transform="rotate(225)"/><line x1="0" y1="-40" x2="0" y2="-50" transform="rotate(270)"/><line x1="0" y1="-40" x2="0" y2="-50" transform="rotate(315)"/>
    </g>
  </g>

  <!-- 云 -->
  <g fill="#fff" opacity="0.95">

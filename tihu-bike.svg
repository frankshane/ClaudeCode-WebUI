      <animate attributeName="opacity" values="0;0.9;0" dur="0.8s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-30 0" dur="0.8s" begin="0s" repeatCount="indefinite"/>
    </line>
    <line x1="140" y1="215" x2="100" y2="215" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="0.8s" begin="0.27s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-30 0" dur="0.8s" begin="0.27s" repeatCount="indefinite"/>

    <g transform="translate(980,316)"><circle r="4" fill="#ff8fab"/><circle r="1.6" fill="#ffe066"/></g>
    <g transform="translate(1160,316)"><circle r="4" fill="#ff8fab"/><circle r="1.6" fill="#ffe066"/></g>
  </g>

  <!-- 路 -->
  <rect y="324" width="600" height="76" fill="#6b6f7a"/>
  <rect y="324" width="600" height="5" fill="#565a64"/>
  <g fill="#f5f5f5">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-120 0" dur="0.55s" repeatCount="indefinite"/>
    <rect x="0" y="360" width="60" height="6" rx="3"/><rect x="120" y="360" width="60" height="6" rx="3"/><rect x="240" y="360" width="60" height="6" rx="3"/><rect x="360" y="360" width="60" height="6" rx="3"/><rect x="480" y="360" width="60" height="6" rx="3"/><rect x="600" y="360" width="60" height="6" rx="3"/><rect x="720" y="360" width="60" height="6" rx="3"/>

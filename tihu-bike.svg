    </g>
    <g transform="translate(850,302)">
      <rect x="-4" y="-30" width="8" height="30" fill="#8b5a3c"/>
      <circle cy="-42" r="20" fill="#4fae62"/><circle cx="-10" cy="-32" r="13" fill="#5cbd70"/><circle cx="11" cy="-33" r="12" fill="#45a058"/>
    </g>
    <g transform="translate(1070,302)">
      <rect x="-4" y="-30" width="8" height="30" fill="#8b5a3c"/>
      <circle cy="-42" r="20" fill="#4fae62"/><circle cx="-10" cy="-32" r="13" fill="#5cbd70"/><circle cx="11" cy="-33" r="12" fill="#45a058"/>
    </g>
    
    <g transform="translate(130,316)"><circle r="4" fill="#ff8fab"/><circle r="1.6" fill="#ffe066"/></g>
    <g transform="translate(380,316)"><circle r="4" fill="#ff8fab"/><circle r="1.6" fill="#ffe066"/></g>
    <g transform="translate(560,316)"><circle r="4" fill="#ff8fab"/><circle r="1.6" fill="#ffe066"/></g>

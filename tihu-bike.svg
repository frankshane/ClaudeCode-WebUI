      <animateTransform attributeName="transform" type="translate" from="650 0" to="-200 0" dur="22s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="70" rx="40" ry="16"/><ellipse cx="22" cy="58" rx="24" ry="18"/><ellipse cx="-18" cy="62" rx="18" ry="13"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="350 0" to="-500 0" dur="22s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="120" rx="32" ry="12"/><ellipse cx="16" cy="110" rx="18" ry="14"/>
    </g>
    <g>

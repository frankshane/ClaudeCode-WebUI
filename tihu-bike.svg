    <line x1="150" y1="255" x2="110" y2="255" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="0.8s" begin="0.53s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-30 0" dur="0.8s" begin="0.53s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 影子 -->
  <ellipse cx="280" cy="328" rx="130" ry="7" fill="#000" opacity="0.18"/>

